name: reachinbox-scheduler
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: email_scheduler
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d email_scheduler"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["127.0.0.1:9200:9200"]
    volumes: ["elastic_data:/usr/share/elasticsearch/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    env_file: .env
    environment:
      DATABASE_URL: postgresql://scheduler:${POSTGRES_PASSWORD:-scheduler}@postgres:5432/email_scheduler?schema=public
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:4000/api/auth/google/callback}
      SLACK_CALLBACK_URL: ${SLACK_CALLBACK_URL:-http://localhost:4000/api/integrations/slack/callback}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    env_file: .env
    environment:
      DATABASE_URL: postgresql://scheduler:${POSTGRES_PASSWORD:-scheduler}@postgres:5432/email_scheduler?schema=public
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:4000/api/auth/google/callback}
      SLACK_CALLBACK_URL: ${SLACK_CALLBACK_URL:-http://localhost:4000/api/integrations/slack/callback}
    ports: ["127.0.0.1:4000:4000"]
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL-http://localhost:4000}
    ports: ["127.0.0.1:5173:80"]
    restart: unless-stopped
    depends_on: [api]
  caddy:
    image: caddy:2-alpine
    profiles: ["production"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  elastic_data:
  caddy_data:
  caddy_config: